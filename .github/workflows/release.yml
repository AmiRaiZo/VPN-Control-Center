name: Monorepo Release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "RELEASE_NOTES_*.md"
      - "install/build_release_zip.sh"
      - "install/verify_release_archive.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Invalid VERSION: $version" >&2
            exit 1
          }
          tag="v$version"
          notes="RELEASE_NOTES_$version.md"
          [[ -s "$notes" ]] || {
            echo "Missing release notes: $notes" >&2
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Build and verify release ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x install/verify_release_archive.sh
          asset="$RUNNER_TEMP/vpn-panel-fixed-${{ steps.meta.outputs.version }}.zip"
          bash install/build_release_zip.sh "$asset"
          test -s "$asset"
          echo "RELEASE_ASSET=$asset" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" "$RELEASE_ASSET" \
            --title "VPN Panel + VPN Control Center ${{ steps.meta.outputs.version }}" \
            --notes-file "${{ steps.meta.outputs.notes }}"
