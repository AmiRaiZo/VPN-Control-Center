name: Monorepo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bot and backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "bot[dev]"
          python -m pip install -r backend/requirements.txt pytest
      - name: Lint bot
        run: ruff check bot/src bot/tests bot/alembic
      - name: Test bot
        run: pytest -q bot/tests
      - name: Test backend
        run: pytest -q backend/tests
      - name: Compile Python sources
        run: python -m compileall -q bot/src bot/tests bot/alembic backend/app backend/tests
      - name: Installer integration checks
        run: bash bot/tests/test_installer_integration.sh
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
