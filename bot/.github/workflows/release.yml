name: Publish versioned release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run release gate
        run: |
          python -m pip install -e '.[dev]'
          ruff check src tests
          pytest -q
      - name: Verify database migrations
        env:
          DATABASE_URL: sqlite+aiosqlite:///./release-check.db
        run: alembic upgrade head && alembic check && alembic downgrade base
      - name: Create GitHub Release for the project version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to publish."
            exit 0
          fi
          gh release create "${TAG}" --target "${GITHUB_SHA}" \
            --title "VPN Control Center ${VERSION}" --notes-file CHANGELOG.md
